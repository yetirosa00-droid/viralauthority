# ViralAuthority PRO - Hardened Nginx Production Config
# IP: 167.86.74.3

# 1. Strict Isolation: Drop connections for unknown domains or direct IP access
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444; # Connection closed without response
}

# 2. Main Application: viralauthoritypro.com
server {
    listen 80;
    listen [::]:80;
    server_name viralauthoritypro.com www.viralauthoritypro.com;
    
    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name viralauthoritypro.com www.viralauthoritypro.com;
    server_tokens off;

    # SSL Certificates (Uncomment after running certbot)
    # ssl_certificate /etc/letsencrypt/live/viralauthoritypro.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/viralauthoritypro.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

    # Next.js Frontend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 250M; # Increased for large media uploads
    }
}

# 3. Dedicated API Engine: api.viralauthoritypro.com
server {
    listen 80;
    server_name api.viralauthoritypro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name api.viralauthoritypro.com;
    server_tokens off;

    # SSL Certificates (Uncomment after running certbot)
    # ssl_certificate /etc/letsencrypt/live/viralauthoritypro.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/viralauthoritypro.com/privkey.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Hardened CORS for production
        add_header 'Access-Control-Allow-Origin' 'https://viralauthoritypro.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
