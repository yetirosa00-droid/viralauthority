name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "./*, !node_modules, !.git, !.github"
          target: "/var/www/viralauthoritypro"
          rm: false

      - name: Run setup and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/viralauthoritypro
            
            # Fix Backend deps
            cd backend && npm install && cd ..

            # Setup base env
            chmod +x ./scripts/setup_vps.sh
            ./scripts/setup_vps.sh

            # Move and configure Nginx
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo cp infra/nginx.conf /etc/nginx/sites-available/viralauthoritypro
            sudo ln -sf /etc/nginx/sites-available/viralauthoritypro /etc/nginx/sites-enabled/
            
            # Ensure yt-dlp is latest (Fixes "Video not found")
            echo "📥 Updating yt-dlp engine..."
            sudo yt-dlp -U || true

            # PM2 Setup
            pm2 delete vpro-api vpro-app || true
            pm2 start backend/index.js --name vpro-api
            pm2 start npm --name vpro-app -- start
            pm2 save

            # SSL Setup (Certbot)
            echo "🔐 Configuring SSL Security..."
            sudo certbot --nginx -d viralauthoritypro.com -d www.viralauthoritypro.com -d api.viralauthoritypro.com --non-interactive --agree-tos --email webmaster@viralauthoritypro.com --redirect --expand || echo "⚠️ Warning: SSL could not be automatically configured. Please run certbot manually."

            # Final Nginx restart and status check
            sudo nginx -t && sudo systemctl restart nginx
            
            # Health Checks
            echo "🔍 [DIAGNOSTIC] Checking services..."
            curl -I http://localhost:3000
            curl -I http://localhost:3001/health
            
            pm2 list
            sudo systemctl status nginx --no-pager
