name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://api.viralauthoritypro.com
          NEXT_PUBLIC_APP_URL: https://viralauthoritypro.com
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 20m
          script: |
            mkdir -p /var/www/viralauthoritypro
            # Clean up old files but keep the directory
            find /var/www/viralauthoritypro -mindepth 1 -maxdepth 1 ! -name 'cookies.txt' -exec rm -rf {} +
            chown -R root:root /var/www/viralauthoritypro

      - name: Upload code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "./*, !node_modules, !.git, !.github"
          target: "/var/www/viralauthoritypro"
          rm: false

      - name: Run setup and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 30m
          script: |
            cd /var/www/viralauthoritypro
            
            # Fix Nginx (Isolate site)
            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo rm -f /etc/nginx/sites-enabled/vytrixe*
            cp infra/nginx.conf /etc/nginx/sites-available/viralauthoritypro
            ln -sf /etc/nginx/sites-available/viralauthoritypro /etc/nginx/sites-enabled/
            
            # Setup environment
            chmod +x scripts/setup_vps.sh
            ./scripts/setup_vps.sh
            
            # Backend
            cd backend && npm install
            pm2 delete vpro-api || true
            pm2 start index.js --name "vpro-api"
            
            # Frontend (Already built on GitHub, just install prod deps and start)
            cd ..
            npm install --production
            pm2 delete vpro-app || true
            pm2 start npm --name "vpro-app" -- start -- -p 3000
            
            # Wait for services to start
            echo "⏳ Waiting for services to initialize..."
            sleep 10
            
            # Link SSL (Already installed by setup_vps.sh)
            sudo certbot --nginx -d viralauthoritypro.com -d api.viralauthoritypro.com --non-interactive --agree-tos --email webmaster@viralauthoritypro.com --redirect --expand || true
            
            # Final Nginx restart and status check
            sudo nginx -t && sudo systemctl restart nginx
            
            # Health Checks
            echo "🔍 [DIAGNOSTIC] Checking local ports..."
            curl -I http://localhost:3000 || echo "❌ Frontend NOT responding on port 3000"
            curl -I http://localhost:3001/health || echo "❌ Backend NOT responding on port 3001"
            
            pm2 list
            systemctl status nginx --no-pager

