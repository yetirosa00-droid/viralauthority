# ViralAuthority PRO - Production Nginx Config
# Correctly handles both Next.js App and Backend Engine

server {
    server_name viralauthoritypro.com www.viralauthoritypro.com api.viralauthoritypro.com 167.86.74.3;

    # Gzip for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. API Engine (Port 3001) - Specific routes only
    location ~ ^/(download-file|stream|health) {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Support for frontend consistent API calls (Proxy to Backend)
    location /api/download-file {
        proxy_pass http://localhost:3001/download-file;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 250M;
    }

    location /api/stream {
        proxy_pass http://localhost:3001/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 2. Next.js Frontend (Port 3000)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 250M;
    }

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/viralauthoritypro.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/viralauthoritypro.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.viralauthoritypro.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.viralauthoritypro.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = viralauthoritypro.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name viralauthoritypro.com www.viralauthoritypro.com api.viralauthoritypro.com 167.86.74.3;
    return 404; # managed by Certbot
}
